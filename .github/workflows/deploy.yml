name: Build and Deploy to Nexus

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*.*.*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Build Version and Nexus URL
        id: set-version
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/develop ]]; then
            VERSION="1.0.${GITHUB_RUN_NUMBER}-SNAPSHOT"
            NEXUS_URL=${{ secrets.NEXUS_SNAPSHOT_URL }}
          elif [[ "${GITHUB_REF}" == refs/heads/main || "${GITHUB_REF}" == refs/heads/master ]]; then
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
            NEXUS_URL=${{ secrets.NEXUS_RELEASE_URL }}
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            NEXUS_URL=${{ secrets.NEXUS_RELEASE_URL }}
          fi

          echo "BUILD_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "NEXUS_URL=${NEXUS_URL}" >> $GITHUB_ENV

          echo "::set-output name=BUILD_VERSION::${VERSION}"
          echo "::set-output name=NEXUS_URL::${NEXUS_URL}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish to Nexus
        run: ./gradlew publish
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_URL: ${{ env.NEXUS_URL }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}

      - name: Create Git Tag for main/master
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git tag v${{ env.BUILD_VERSION }}
          git push origin v${{ env.BUILD_VERSION }}
